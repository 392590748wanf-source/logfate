name: 发布 Windows 客户端

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 校验内置数据包
        run: pnpm data:check
      - name: 校验版本标签
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "标签 ${{ github.ref_name }} 必须与 package.json 的 v$version 一致。" }
      - name: 清理旧版客户端构建产物
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Name -like 'GilFate-Setup-*' -or $_.Name -eq 'latest.yml' } |
            Remove-Item -Force
      - name: 构建 Windows 安装包
        run: pnpm run dist:win

      - name: 上传完整 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LogFate ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

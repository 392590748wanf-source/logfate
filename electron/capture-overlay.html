<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'self'; style-src 'unsafe-inline'">
  <title>框选采购记录</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; font: 14px "Microsoft YaHei", sans-serif; }
    #image { position: absolute; width: 100%; height: 100%; object-fit: fill; user-select: none; pointer-events: none; }
    #veil { position: absolute; inset: 0; background: #0006; pointer-events: none; }
    #selection { position: absolute; display: none; border: 2px solid #fff; box-shadow: 0 0 0 1px #1769aa, 0 0 0 9999px #0007; pointer-events: none; }
    #help { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 10px 14px; border-radius: 5px; background: #fff; color: #111; box-shadow: 0 3px 14px #0005; pointer-events: none; }
  </style>
</head>
<body>
  <img id="image" alt="当前屏幕截图">
  <div id="veil"></div>
  <div id="selection"></div>
  <div id="help">拖拽框选采购记录区域 · Esc 取消</div>
  <script src="capture-overlay.js"></script>
</body>
</html>
